      properties:
        order_id:
          type: string
          format: uuid
        number:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        carrier:
          type: string
          nullable: true
        tracking_number:
          type: string
          nullable: true
        estimated_delivery:
          type: string
          format: date

# Reader API. Installed to /etc/nginx/sites-available/reader-api by
# deploy/setup-server.sh.
#
# The script rewrites these defaults when APP_DIR, APP_DOMAIN, or
# DAPHNE_PORT are set:
#   /opt/reader-api
#   server_name _;
#   127.0.0.1:8001
#
# Daphne is one process (the channel layer is in-memory) and listens on
# localhost only. TLS is added by certbot when a domain and email are set.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /opt/reader-api/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/reader-api/media/;
        access_log off;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

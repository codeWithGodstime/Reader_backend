# Reader API. One Daphne process, Postgres, nginx, and Certbot.
# Daphne stays on the Compose network. nginx publishes ports 80 and 443.
# The channel layer is in-memory, so do not scale the api service.

name: reader-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reader}
      POSTGRES_USER: ${POSTGRES_USER:-reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  api:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:?Set GOOGLE_OAUTH_CLIENT_IDS in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-reader}
      POSTGRES_USER: ${POSTGRES_USER:-reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DOMAIN: ${APP_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SEED: ${SEED:-0}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; d=os.environ.get('APP_DOMAIN','').strip(); hs=[h.strip() for h in os.environ.get('ALLOWED_HOSTS','').split(',') if h.strip()]; h=d or (hs[0] if hs else 'localhost'); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8001/api/schema/', headers={'Host': h}), timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 200s
    logging: *default-logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/app.conf:/opt/nginx/app.conf:ro
      - ./docker/nginx/http.conf:/opt/nginx/http.conf:ro
      - ./docker/nginx/redirect.conf:/opt/nginx/redirect.conf:ro
      - ./docker/nginx/https.conf:/opt/nginx/https.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.3.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-false}
    volumes:
      - ./docker/certbot/entrypoint.sh:/entrypoint.sh:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  staticfiles:
  media:
  certbot_www:
  certbot_certs:
